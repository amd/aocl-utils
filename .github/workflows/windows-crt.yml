name: "Windows CRT guard"

# Guards against the MSVC RuntimeLibrary (/MT vs /MD) regression class.
# A default (both-libs) configure must produce a /MT static archive and a /MD
# shared DLL simultaneously. Painting the static archive /MD (the prior bug)
# silently breaks every /MT downstream consumer (e.g. aocl-sparse) at link time.
# This job builds the default configuration, runs the tests, and asserts the
# CRT baked into each artifact via dumpbin /directives.

on:
  workflow_dispatch:
  pull_request:
    branches: [ amd-main ]
  schedule:
    - cron: '0 9 * * 6'

jobs:
  crt-guard:
    name: MSVC CRT duality (static=/MT, shared=/MD)
    # NOTE: runner label assumed to mirror the CodeQL job's `amd_linux`.
    # Adjust if the Windows self-hosted runner uses a different label.
    runs-on: amd_windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (default = both libs)
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release -DAU_BUILD_TESTS=ON
          if errorlevel 1 exit /b 1

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release
          if errorlevel 1 exit /b 1

      - name: Run tests
        shell: cmd
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if errorlevel 1 exit /b 1

      # Assert the CRT baked into each artifact. dumpbin /directives prints the
      # /DEFAULTLIB directives embedded by the compiler:
      #   /MT -> LIBCMT          /MD -> MSVCRT
      # The static archive must be LIBCMT-only; the DLL must be MSVCRT-only.
      - name: Assert static lib is /MT and shared DLL is /MD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $static = Get-ChildItem -Path build -Recurse -Filter 'libaoclutils_static.lib' | Select-Object -First 1
          $dll    = Get-ChildItem -Path build -Recurse -Filter 'libaoclutils.dll'         | Select-Object -First 1
          if (-not $static) { throw "libaoclutils_static.lib not found under build/" }
          if (-not $dll)    { throw "libaoclutils.dll not found under build/" }

          Write-Host "Static archive: $($static.FullName)"
          $sDir = (dumpbin /directives $static.FullName | Out-String)
          if ($sDir -match 'MSVCRT')      { throw "FAIL: static archive links the DYNAMIC CRT (/MD). Expected /MT (LIBCMT)." }
          if ($sDir -notmatch 'LIBCMT')   { throw "FAIL: static archive does not declare LIBCMT (/MT)." }
          Write-Host "  OK: static archive is /MT (LIBCMT)."

          Write-Host "Shared DLL: $($dll.FullName)"
          # The DLL's CRT directives live in its objects; inspect the import lib's
          # objects via the DLL's exports table is unreliable, so check the DLL's
          # linked CRT dependency instead.
          $dDeps = (dumpbin /dependents $dll.FullName | Out-String)
          if ($dDeps -notmatch 'VCRUNTIME|MSVCP|api-ms-win-crt') {
            throw "FAIL: shared DLL does not depend on the dynamic CRT runtime. Expected /MD."
          }
          Write-Host "  OK: shared DLL depends on the dynamic CRT (/MD)."

      - name: Cleanup workspace
        if: always()
        shell: cmd
        run: rmdir /s /q build 2>nul & exit /b 0
