name: "Check CPUID Unification"

on:
  push:
    branches: [amd-main, amd-staging]
    paths:
      - 'SDK/Include/Capi/au/cpuid/**'
      - 'SDK/Include/Au/Defs.hh'
      - 'SDK/Include/Capi/au/**'
      - 'scripts/tools/unify_cpuid.py'
      - '.github/workflows/check-unification.yml'
      # version.txt is baked into the generated header (AU_PACKAGE_VERSION), so
      # a version bump desyncs it. Without this, the failure surfaces later and
      # is blamed on the next PR that happens to touch the paths above.
      - 'version.txt'
      # Compiled and run by the self-containment steps below.
      - 'tests/unification/test_self_contained.c'
  pull_request:
    branches: [amd-main, amd-staging]
    paths:
      - 'SDK/Include/Capi/au/cpuid/**'
      - 'SDK/Include/Au/Defs.hh'
      - 'SDK/Include/Capi/au/**'
      - 'scripts/tools/unify_cpuid.py'
      - '.github/workflows/check-unification.yml'
      # version.txt is baked into the generated header (AU_PACKAGE_VERSION), so
      # a version bump desyncs it. Without this, the failure surfaces later and
      # is blamed on the next PR that happens to touch the paths above.
      - 'version.txt'
      # Compiled and run by the self-containment steps below.
      - 'tests/unification/test_self_contained.c'

jobs:
  check-unification:
    name: Verify Unified Header is Up-to-Date
    # Runs on the self-hosted runner (aocl-utils is a private repo behind an org
    # IP allow-list, so GitHub-hosted runners get a 403 on checkout).
    #
    # This job needs no CMake and no C/C++ toolchain to regenerate: the
    # generator never reads the build-generated Au/Config.h, it only substitutes
    # a deterministic synthetic block for that include. A configure step used to
    # run here purely to satisfy an existence check, which made a pure-Python
    # task depend on a working toolchain -- and on a pinned CMake, because one
    # runner instance in the pool had a broken pip cmake shim earlier in its
    # PATH that exited 1 instantly and made this check flake. Dropping the
    # requirement removed both. gcc is still needed, but only by the
    # self-containment steps at the end.
    runs-on: amd_linux
    env:
      # Single source of truth for the generator's paths. The failure hint below
      # echoes the same variables the real invocation uses, so the printed
      # command cannot drift out of sync with the command actually run -- which
      # is how the previous hint came to name a build dir that never existed.
      SDK_INCLUDE: SDK/Include
      ENTRY: SDK/Include/Capi/au/cpuid/cpuid_inline.h
      UNIFIED: SDK/Include/Capi/au/cpuid/au_cpuid_header_only.h
      UNIFIED_NEW: SDK/Include/Capi/au/cpuid/au_cpuid_header_only_new.h

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Regenerate unified header
        run: |
          python3 scripts/tools/unify_cpuid.py \
            --entry "$ENTRY" \
            --sdk-include "$SDK_INCLUDE" \
            --output "$UNIFIED_NEW"

      - name: Compare with checked-in version
        run: |
          if ! diff -u "$UNIFIED" "$UNIFIED_NEW"; then
            echo "ERROR: The unified header is out of sync with the sources."
            echo "Run the following locally and commit the result:"
            echo ""
            echo "  python3 scripts/tools/unify_cpuid.py \\"
            echo "    --entry $ENTRY \\"
            echo "    --sdk-include $SDK_INCLUDE \\"
            echo "    --output $UNIFIED"
            echo ""
            exit 1
          fi
          echo "Unified header is up-to-date."

      - name: Verify self-containment
        run: |
          mkdir -p build-unify-test
          gcc -std=c11 -Wall -Wextra -Werror \
            -I SDK/Include/Capi/au/cpuid \
            -o build-unify-test/test_self_contained \
            tests/unification/test_self_contained.c
          echo "Self-contained compilation succeeded."

      - name: Run self-contained test
        run: |
          ./build-unify-test/test_self_contained
          echo "Self-contained test passed."
